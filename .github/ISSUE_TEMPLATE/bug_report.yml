name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The fastest way is the app's own «Report a problem» in Settings: it sends the log with keys removed. Security issues go to [SECURITY.md](https://github.com/makquella/dota-ai-coach/blob/main/SECURITY.md), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a bot match as Juggernaut
        2. Drop below 30 % HP at 5:00
        3. …
  - type: input
    id: version
    attributes:
      label: Wardly version
      description: Shown in Settings next to the update check, or in the installer name.
      placeholder: "0.56.0"
    validations:
      required: true
  - type: input
    id: report
    attributes:
      label: Problem report number (if you sent one)
      placeholder: "R-7F3KQ2"
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Advice during the match (overlay, voice)
        - Review after the match
        - Progress, profile, friends
        - Installation, update, first run
        - Website or Telegram channel
        - Something else
