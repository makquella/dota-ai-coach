name: Validate generated refresh

# Workflow-token PRs do not trigger ordinary pull_request CI. Run it directly
# on the generated commit, then publish an honest result on that immutable SHA.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Immutable commit to validate without fetching new source data
        required: true
        type: string
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      source_sha: ${{ inputs.source_sha }}
  publish:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - uses: actions/github-script@v7
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        with:
          script: |
            const sha = process.env.SOURCE_SHA;
            if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error("Invalid source SHA");
            const passed = process.env.VALIDATION_RESULT === "success";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.checks.create({
              ...context.repo,
              name: "Generated refresh functional validation",
              head_sha: sha,
              status: "completed",
              conclusion: passed ? "success" : "failure",
              details_url: run,
              output: {
                title: passed ? "Immutable refresh commit passed CI" : "Refresh validation did not pass",
                summary: `Source: ${sha}. Full reusable backend/desktop/Windows validation: ${process.env.VALIDATION_RESULT}. Audit reports require separate triage. Run: ${run}`,
              },
            });
