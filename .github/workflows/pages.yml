name: Website

# Publishes site/ to GitHub Pages. Manual until Pages is switched on
# (Settings -> Pages -> Source: GitHub Actions); see site/README.md.
on:
  workflow_dispatch:
  # news.yml publishes the site right after committing a post.
  workflow_call:
    inputs:
      ref:
        description: "The commit to publish"
        type: string
        required: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
