name: Release

# Push a tag "v<version>" (matching frontend/launcher/package.json) to build,
# smoke-test and publish the Windows installer as a GitHub Release. Or run it
# by hand on main (Actions -> Release -> Run workflow): it then releases the
# version from package.json and creates the tag "v<version>" itself when it
# publishes. Installed apps update themselves from the latest release
# (electron-updater reads latest.yml from it), see docs/PACKAGING_WINDOWS.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content frontend/launcher/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            if ($env:GITHUB_REF -ne "refs/heads/main") {
              throw "Run the release by hand only on main (got $env:GITHUB_REF)."
            }
            $tag = "v$version"
            gh api "repos/$env:GITHUB_REPOSITORY/git/matching-refs/tags/$tag" --jq '.[].ref' |
              Where-Object { $_ -eq "refs/tags/$tag" } |
              ForEach-Object { throw "Tag $tag already exists: bump the version in frontend/launcher/package.json first." }
            if ($LASTEXITCODE -ne 0) { throw "Could not check existing tags (gh exit code $LASTEXITCODE)." }
          } else {
            $tag = $env:GITHUB_REF_NAME
            if ("v$version" -ne $tag) {
              throw "Tag $tag does not match frontend/launcher/package.json version $version (expected v$version)."
            }
          }
          "TAG=$tag" >> $env:GITHUB_ENV
          Write-Host "Releasing $tag from $env:GITHUB_SHA"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/launcher/package-lock.json

      - name: Build backend exe, Electron app and NSIS installer
        # Signing secrets are optional: without them the release is unsigned
        # (see docs/PACKAGING_WINDOWS.md, "Code signing").
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          SIGN_PUBLISHER_NAME: ${{ secrets.SIGN_PUBLISHER_NAME }}
        run: ./scripts/build-windows.ps1

      - name: Check code signatures
        env:
          SIGNING_CONFIGURED: ${{ secrets.CSC_LINK != '' || secrets.AZURE_SIGNING_ENDPOINT != '' }}
        run: |
          $version = $env:TAG.Substring(1)
          $dist = "frontend/launcher/dist"
          $files = @(
            "$dist/Wardly-Setup-$version.exe",
            "$dist/win-unpacked/Wardly.exe",
            "$dist/win-unpacked/resources/backend/dota-ai-coach-backend.exe"
          )
          $unsigned = @()
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            Write-Host "$file : $($signature.Status) $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne "Valid") { $unsigned += $file }
          }
          if ($env:SIGNING_CONFIGURED -eq "true" -and $unsigned) {
            throw "Signing is configured but these files are not validly signed: $($unsigned -join ', ')"
          }
          if ($unsigned) {
            Write-Host "::warning::The release is not code-signed: Windows SmartScreen will warn on install."
          }

      - name: Smoke test (backend /health, app, installer)
        run: ./scripts/smoke-windows.ps1

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:TAG.Substring(1)
          $dist = "frontend/launcher/dist"
          # electron-updater needs all three: the feed, the installer and its blockmap.
          $files = @(
            "$dist/latest.yml",
            "$dist/Wardly-Setup-$version.exe",
            "$dist/Wardly-Setup-$version.exe.blockmap"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
          }
          # --target only matters for a manual run: gh then creates the tag on
          # the built commit. For a tag push the tag already exists.
          # Hand-written notes for players when docs/release-notes/<tag>.md exists.
          $notes = "docs/release-notes/$($env:TAG).md"
          $notesArgs = if (Test-Path $notes) { @("--notes-file", $notes) } else { @("--generate-notes") }
          gh release create $env:TAG @files --target $env:GITHUB_SHA --title "Wardly $version" @notesArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-logs
          path: |
            ${{ runner.temp }}/smoke-*.json
            ${{ runner.temp }}/launcher.log
          if-no-files-found: ignore
