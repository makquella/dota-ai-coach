name: Release

# Push a tag "v<version>" (matching frontend/launcher/package.json) to build,
# smoke-test and publish the Windows installer as a GitHub Release. Installed
# apps update themselves from the latest release (electron-updater reads
# latest.yml from it), see docs/PACKAGING_WINDOWS.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish Windows installer
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          $version = (Get-Content frontend/launcher/package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:TAG) {
            throw "Tag $env:TAG does not match frontend/launcher/package.json version $version (expected v$version)."
          }

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/launcher/package-lock.json

      - name: Build backend exe, Electron app and NSIS installer
        # Signing secrets are optional: without them the release is unsigned
        # (see docs/PACKAGING_WINDOWS.md, "Code signing").
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
          SIGN_PUBLISHER_NAME: ${{ secrets.SIGN_PUBLISHER_NAME }}
        run: ./scripts/build-windows.ps1

      - name: Check code signatures
        env:
          SIGNING_CONFIGURED: ${{ secrets.CSC_LINK != '' || secrets.AZURE_SIGNING_ENDPOINT != '' }}
        run: |
          $version = $env:TAG.Substring(1)
          $dist = "frontend/launcher/dist"
          $files = @(
            "$dist/DotaAICoach-Setup-$version.exe",
            "$dist/win-unpacked/DotaAICoach.exe",
            "$dist/win-unpacked/resources/backend/dota-ai-coach-backend.exe"
          )
          $unsigned = @()
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature $file
            Write-Host "$file : $($signature.Status) $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne "Valid") { $unsigned += $file }
          }
          if ($env:SIGNING_CONFIGURED -eq "true" -and $unsigned) {
            throw "Signing is configured but these files are not validly signed: $($unsigned -join ', ')"
          }
          if ($unsigned) {
            Write-Host "::warning::The release is not code-signed: Windows SmartScreen will warn on install."
          }

      - name: Smoke test (backend /health, app, installer)
        run: ./scripts/smoke-windows.ps1

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:TAG.Substring(1)
          $dist = "frontend/launcher/dist"
          # electron-updater needs all three: the feed, the installer and its blockmap.
          $files = @(
            "$dist/latest.yml",
            "$dist/DotaAICoach-Setup-$version.exe",
            "$dist/DotaAICoach-Setup-$version.exe.blockmap"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing release file: $file" }
          }
          gh release create $env:TAG @files --title "Dota AI Coach $version" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit code $LASTEXITCODE" }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-logs
          path: |
            ${{ runner.temp }}/smoke-*.json
            ${{ runner.temp }}/launcher.log
          if-no-files-found: ignore
