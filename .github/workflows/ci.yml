name: CI

on:
  push:
    branches: [main]
  # All PRs, including ones stacked on another feature branch.
  pull_request:

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      # Soft start: mypy reports issues but does not fail the job yet.
      - name: Type check (mypy, non-blocking)
        run: mypy app || true

      - name: Tests (pytest)
        run: pytest -q

      - name: Byte-compile (compileall)
        run: python -m compileall -q app scripts packaging tests

      - name: Site changelog matches docs/release-notes
        run: python ../scripts/build_changelog.py --check

      - name: Generated site pages match the hero profiles and texts
        run: python ../scripts/build_site.py --check

  frontend:
    name: Frontend (node --check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax check desktop app (launcher + overlay window)
        run: |
          node --check frontend/launcher/main.js
          node --check frontend/launcher/preload.js
          node --check frontend/launcher/settings.js
          node --check frontend/launcher/overlay-window.js
          node --check frontend/launcher/overlay-placement.js
          node --check frontend/launcher/overlay-preload.js
          node --check frontend/launcher/overlay-visibility.js
          node --check frontend/launcher/dota-watcher.js
          node --check frontend/launcher/steam-locator.js
          node --check frontend/launcher/updater.js
          node --check frontend/launcher/problem-report.js
          node --check frontend/launcher/dota-assets.js
          node --check frontend/launcher/renderer/app.js
          node --check frontend/launcher/renderer/charts.js
          node --check frontend/launcher/renderer/tour.js
          node --check frontend/launcher/renderer/settings-search.js
          node --check frontend/launcher/renderer/matches.js
          node --check frontend/launcher/renderer/dota-icons.js
          node --check frontend/launcher/renderer/dota-data.js
          node --check frontend/launcher/overlay/app.js
          node --check frontend/launcher/overlay/voice.js
          node --check frontend/launcher/splash/splash.js
          node --check frontend/launcher/transfer-code.js
          node --check frontend/launcher/discord-presence.js
          node --check frontend/launcher/discord-weekly.js
          node --check frontend/launcher/advice-stats.js
          node --check frontend/launcher/friends.js
          node --check frontend/launcher/skill-arrow-window.js
          node --check frontend/launcher/skill-arrow-placement.js
          node --check frontend/launcher/skill-arrows-preload.js
          node --check frontend/launcher/skill-arrows/app.js
          node --check frontend/launcher/assets/icons/lucide.js

      - name: Unit tests (node --test, no dependencies)
        working-directory: frontend/launcher
        run: npm test

  windows-package:
    name: Windows package (PyInstaller + NSIS, /health smoke)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-build.txt

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/launcher/package-lock.json

      - name: Build backend exe, Electron app and NSIS installer
        run: ./scripts/build-windows.ps1

      - name: Smoke test (backend /health, app, installer)
        run: ./scripts/smoke-windows.ps1

      - name: Upload installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Wardly-windows-installer
          path: frontend/launcher/dist/Wardly-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-logs
          path: |
            ${{ runner.temp }}/smoke-*.json
            ${{ runner.temp }}/launcher.log
          if-no-files-found: ignore
