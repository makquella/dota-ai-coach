version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend/launcher
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 3
    groups:
      desktop-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /services/api
    schedule:
      interval: weekly
      day: wednesday
    open-pull-requests-limit: 3
    groups:
      worker-compatible:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
