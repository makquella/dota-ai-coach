<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dota AI Coach Overlay</title>
    <style>
      :root {
        color-scheme: light;
        --bg: rgba(238, 242, 245, 0.94);
        --card: #ffffff;
        --text: #17202a;
        --muted: #62717c;
        --border: #cfd8df;
        --primary: #216a5b;
        --warn: #9b4a1f;
        --danger: #9f1f17;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 320px;
        min-height: 110px;
        background: var(--bg);
        color: var(--text);
      }

      main {
        padding: 12px;
      }

      .card {
        padding: 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--card);
        box-shadow: 0 10px 24px rgba(30, 43, 52, 0.12);
      }

      .status-panel {
        padding: 10px 4px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }

      h1 {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.2;
      }

      .mode {
        margin: 0 0 6px;
        color: var(--muted);
        font-size: 0.7rem;
        font-weight: 800;
        text-transform: uppercase;
      }

      .action-text {
        margin: 0 0 8px;
        color: var(--text);
        font-size: 1.05rem;
        font-weight: 800;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      .reason-text {
        margin: 0;
        color: var(--muted);
        font-size: 0.84rem;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .status-row {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin: 0 0 8px;
      }

      .status-chip {
        padding: 2px 6px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--muted);
        font-size: 0.68rem;
        font-weight: 700;
        line-height: 1.3;
      }

      .risk-text {
        margin: 8px 0 0;
        color: var(--warn);
        font-size: 0.75rem;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }

      .badge {
        padding: 3px 8px;
        border-radius: 999px;
        background: #e8f2ef;
        color: var(--primary);
        font-size: 0.75rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      .status {
        margin: 0;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.45;
      }

      .updated {
        margin: 8px 0 0;
        color: var(--muted);
        font-size: 0.75rem;
      }

      dl {
        display: grid;
        gap: 9px;
        margin: 0;
      }

      dt {
        margin-bottom: 2px;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
      }

      dd {
        margin: 0;
        font-size: 0.92rem;
        line-height: 1.35;
        overflow-wrap: anywhere;
      }

      .priority-high {
        color: var(--danger);
      }

      .priority-medium {
        color: var(--warn);
      }

      .hidden {
        display: none;
      }

      @media (max-height: 190px) {
        .risk-text {
          display: none;
        }

        .card {
          padding: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section id="status-panel" class="status-panel" aria-live="polite">
        <p id="status" class="status">Waiting for Dota 2 GSI...</p>
        <p id="status-updated" class="updated">Last updated: --</p>
      </section>

      <section id="recommendation-card" class="card hidden" aria-live="polite">
        <div class="header">
          <h1>Dota AI Coach</h1>
          <span id="priority-badge" class="badge hidden"></span>
        </div>

        <p id="advice-mode" class="mode">Status</p>
        <div id="status-row" class="status-row hidden" aria-label="Live hero status"></div>
        <p id="action" class="action-text"></p>
        <p id="reason" class="reason-text"></p>
        <p id="risk" class="risk-text"></p>
        <p id="card-updated" class="updated">Last updated: --</p>
      </section>
    </main>

    <script>
      const statusPanel = document.querySelector("#status-panel");
      const statusEl = document.querySelector("#status");
      const statusUpdated = document.querySelector("#status-updated");
      const recommendationCard = document.querySelector("#recommendation-card");
      const cardUpdated = document.querySelector("#card-updated");
      const priorityBadge = document.querySelector("#priority-badge");
      const adviceMode = document.querySelector("#advice-mode");
      const statusRow = document.querySelector("#status-row");
      const fields = {
        action: document.querySelector("#action"),
        reason: document.querySelector("#reason"),
        risk: document.querySelector("#risk")
      };

      refreshRecommendation();
      setInterval(refreshRecommendation, 5000);

      async function refreshRecommendation() {
        try {
          const response = await fetch("/overlay/recommendation", { cache: "no-store" });
          const data = await response.json();
          renderOverlay(data);
        } catch (error) {
          showStatus("Backend unavailable. Start FastAPI and keep Dota 2 GSI enabled.");
        }
      }

      function renderOverlay(data) {
        if (data.status === "waiting_for_gsi") {
          showStatus("Waiting for Dota 2 GSI...", data.last_updated);
          return;
        }

        if (data.status === "unsupported_hero") {
          showStatus("Hero not supported yet", data.last_updated);
          return;
        }

        if (data.status === "monitoring") {
          showStatus(data.message || "Monitoring lane - no urgent advice.", data.last_updated);
          return;
        }

        if (data.status === "invalid_state") {
          showStatus("GSI state received, but it cannot be used for advice yet.", data.last_updated);
          return;
        }

        if (data.status === "cooldown" && !data.recommendation) {
          showStatus(statusMessage(data), data.last_updated);
          return;
        }

        if (!data.recommendation) {
          showStatus(statusMessage(data), data.last_updated);
          return;
        }

        const recommendation = data.recommendation;
        for (const field of Object.keys(fields)) {
          fields[field].textContent = recommendation[field] || "";
        }

        adviceMode.textContent = data.advice_mode || "coaching";
        renderStatusRow(data);
        priorityBadge.textContent = recommendation.priority || "fallback";
        priorityBadge.className = `badge priority-${recommendation.priority || "low"}`;
        priorityBadge.classList.remove("hidden");
        cardUpdated.textContent = `${formatUpdated(data.last_updated)} | ${data.source || "fallback"} | #${data.advice_count || 0}`;
        statusPanel.classList.add("hidden");
        recommendationCard.classList.remove("hidden");
      }

      function showStatus(message, timestamp) {
        statusEl.textContent = message;
        statusUpdated.textContent = formatUpdated(timestamp);
        statusPanel.classList.remove("hidden");
        recommendationCard.classList.add("hidden");
        priorityBadge.classList.add("hidden");
        statusRow.classList.add("hidden");
        statusRow.replaceChildren();
      }

      function statusMessage(data) {
        if (data.suppressed_reason === "rate_limit") {
          return "Advice paused to avoid overload.";
        }
        if (data.suppressed_reason === "duplicate") {
          return "No new advice.";
        }
        if (data.suppressed_reason === "cooldown") {
          if (data.message) {
            return data.message;
          }
          const wait = data.next_allowed_advice_in_seconds || 0;
          return `Advice cooldown active. Next check in ${wait}s.`;
        }
        return "No urgent advice";
      }

      function renderStatusRow(data) {
        const chips = [];
        if (Number.isFinite(data.hp_percent)) {
          chips.push(`HP ${data.hp_percent}%`);
        }
        if (Number.isFinite(data.mana_percent)) {
          chips.push(`Mana ${data.mana_percent}%`);
        }
        if (data.gpm !== null && data.gpm !== undefined) {
          chips.push(`GPM ${data.gpm}`);
        }
        if (data.last_hits !== null && data.last_hits !== undefined) {
          chips.push(`LH ${data.last_hits}`);
        }
        if (data.alive === false) {
          chips.push(`Dead ${data.respawn_seconds || 0}s`);
        }
        if (data.smoked) {
          chips.push("Smoked");
        }
        if (data.buyback_available) {
          chips.push("Buyback");
        }
        if (data.match_death_count) {
          chips.push(`Deaths ${data.match_death_count}`);
        }
        if (data.recent_death_pattern) {
          chips.push(String(data.recent_death_pattern).toLowerCase().replaceAll("_", " "));
        }
        if (data.hero_risk_level && data.hero_risk_level !== "low") {
          chips.push(`Hero risk ${data.hero_risk_level}`);
        }
        if (Array.isArray(data.hero_safety_flags) && data.hero_safety_flags.length) {
          chips.push(String(data.hero_safety_flags[0]).replaceAll("_", " "));
        }
        if (Array.isArray(data.status_effects)) {
          for (const effect of data.status_effects) {
            chips.push(String(effect));
          }
        }

        statusRow.replaceChildren();
        if (!chips.length) {
          statusRow.classList.add("hidden");
          return;
        }

        for (const chip of chips.slice(0, 8)) {
          const item = document.createElement("span");
          item.className = "status-chip";
          item.textContent = chip;
          statusRow.appendChild(item);
        }
        statusRow.classList.remove("hidden");
      }

      function formatUpdated(timestamp) {
        if (!timestamp) {
          return "Last updated: --";
        }

        const date = new Date(timestamp);
        if (Number.isNaN(date.getTime())) {
          return "Last updated: just now";
        }

        return `Last updated: ${date.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit"
        })}`;
      }
    </script>
  </body>
</html>
